<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Paladin vs. Dragon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --night: #0b0e1a;
    --ink: #efe7d6;
    --muted: #b3a9c2;
    --shadow: #a883ff;
    --ember: #ff9a4a;
    --steel: #c3c8cf;
    --line: rgba(239, 231, 214, 0.22);
    --display: "IM Fell English SC", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --body: "Alegreya Sans", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--night);
    color: var(--ink);
    font-family: var(--body);
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage canvas:active { cursor: grabbing; }

  .hud { position: fixed; left: 0; right: 0; pointer-events: none; padding-inline: max(16px, 3vw); }
  .hud-top {
    top: 0;
    padding-top: calc(env(safe-area-inset-top, 0px) + 18px);
    padding-bottom: 40px;
    background: linear-gradient(to bottom, rgba(8, 9, 20, 0.7), rgba(8, 9, 20, 0));
  }
  .eyebrow {
    margin: 0 0 4px;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .eyebrow b { color: #9fe0ff; font-weight: 500; }
  .eyebrow i { color: var(--shadow); font-style: normal; }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(26px, 4.4vw, 44px);
    line-height: 1.02;
    text-wrap: balance;
    text-shadow: 0 2px 18px rgba(0, 0, 0, 0.6);
  }
  h1 span { color: var(--ember); }

  .hud-bottom {
    bottom: 0;
    padding-top: 60px;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    background: linear-gradient(to top, rgba(8, 9, 20, 0.82) 30%, rgba(8, 9, 20, 0));
    display: grid;
    gap: 12px;
  }
  .caption { max-width: 60ch; min-height: 76px; transition: opacity 0.4s ease; }
  .caption.fade { opacity: 0; }
  .beat {
    margin: 0;
    font-family: var(--display);
    font-size: clamp(24px, 3.4vw, 34px);
    line-height: 1.1;
    color: var(--ink);
  }
  .beat-line { margin: 4px 0 0; font-size: 16px; line-height: 1.45; color: var(--muted); }

  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; pointer-events: auto; }
  .controls button {
    font: 500 14px/1 var(--body);
    color: var(--ink);
    background: rgba(239, 231, 214, 0.06);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 8px 12px;
    cursor: pointer;
  }
  .controls button:hover { background: rgba(239, 231, 214, 0.14); }
  .controls button[aria-pressed="true"] { border-color: var(--shadow); color: #d9c8ff; }
  .controls button:focus-visible, .timeline button:focus-visible { outline: 2px solid var(--shadow); outline-offset: 2px; }
  .hint { font-size: 13px; color: var(--muted); }

  .timeline { display: flex; gap: 3px; pointer-events: auto; }
  .timeline button {
    position: relative;
    flex: var(--w) 1 0;
    min-width: 0;
    padding: 9px 0 0;
    border: 0;
    background: none;
    color: var(--muted);
    font: 500 11px/1.2 var(--body);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
  }
  .timeline button::before {
    content: "";
    position: absolute; left: 0; right: 0; top: 0; height: 3px;
    background: var(--line);
  }
  .timeline button .fill {
    position: absolute; left: 0; top: 0; height: 3px; width: 0;
    background: linear-gradient(90deg, var(--shadow), #e3d4ff);
  }
  .timeline button.on { color: var(--ink); }
  .timeline button:hover { color: var(--ink); }
  @media (max-width: 620px) {
    .timeline button { font-size: 0; padding-top: 6px; }
    .hint { display: none; }
    .beat-line { font-size: 15px; }
  }
  .fallback {
    position: fixed; inset: 0; display: grid; place-items: center; padding-inline: 24px;
    text-align: center; color: var(--muted); font-size: 16px;
  }
</style>

<div id="stage" aria-label="3D animation of an orc paladin fighting a red dragon"></div>

<header class="hud hud-top">
  <p class="eyebrow">Orc paladin · Oath of Glory · <b>Fly</b> · <i>Shadow longsword</i></p>
  <h1>The Glory Paladin <span>vs.</span> the Red Dragon</h1>
</header>

<section class="hud hud-bottom">
  <div class="caption" id="caption">
    <p class="beat" id="beatName">Flight</p>
    <p class="beat-line" id="beatLine">The Fly spell takes hold. He lifts off above the village rooftops as the red dragon circles in.</p>
  </div>
  <div class="controls">
    <button id="playBtn" type="button">Pause</button>
    <button id="slowBtn" type="button" aria-pressed="false">Slow motion</button>
    <button id="camBtn" type="button">Reset camera</button>
    <span class="hint">Drag to orbit · scroll or pinch to zoom · space to pause</span>
  </div>
  <nav class="timeline" id="timeline" aria-label="Fight beats"></nav>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  if (!window.THREE) {
    document.body.insertAdjacentHTML("beforeend", '<div class="fallback">The 3D library did not load. Check your connection and reload the page.</div>');
    return;
  }

  // ---------- helpers ----------
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ss = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const damp = (a, b, l, dt) => a + (b - a) * (1 - Math.exp(-l * dt));
  const wrapA = (a) => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
  const dampAngle = (a, b, l, dt) => a + wrapA(b - a) * (1 - Math.exp(-l * dt));
  const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const TAU = Math.PI * 2;
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function mk(geo, mat, x, y, z, parent) {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x || 0, y || 0, z || 0);
    m.castShadow = true; m.receiveShadow = true;
    if (parent) parent.add(m);
    return m;
  }
  const UP = V(0, 1, 0);
  function limb(a, b, r1, r2, mat, parent) {
    const d = b.clone().sub(a); const len = d.length();
    const m = mk(new THREE.CylinderGeometry(r2, r1, len, 7), mat, 0, 0, 0, parent);
    m.position.copy(a).addScaledVector(d, 0.5);
    m.quaternion.setFromUnitVectors(UP, d.normalize());
    return m;
  }

  // ---------- renderer / scene ----------
  const stage = $("stage");
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  } catch (e) {
    document.body.insertAdjacentHTML("beforeend", '<div class="fallback">This animation needs WebGL, which this browser has turned off.</div>');
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x3a3352, 0.0065);
  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1200);

  // sky
  const SUN = V(-0.62, 0.16, -0.77).normalize();
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { uSun: { value: SUN } },
    vertexShader: "varying vec3 vW; void main(){ vW = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
    fragmentShader: [
      "uniform vec3 uSun; varying vec3 vW;",
      "void main(){",
      " float h = vW.y;",
      " vec3 top = vec3(0.05,0.07,0.17);",
      " vec3 mid = vec3(0.27,0.22,0.42);",
      " vec3 hor = vec3(0.86,0.55,0.50);",
      " vec3 c = mix(hor, mid, smoothstep(0.0, 0.2, h));",
      " c = mix(c, top, smoothstep(0.2, 0.75, h));",
      " c = mix(c, vec3(0.12,0.10,0.14), smoothstep(0.0, -0.2, h));",
      " float s = max(dot(normalize(vW), uSun), 0.0);",
      " c += vec3(1.0,0.55,0.25) * pow(s, 6.0) * 0.55 * (1.0 - smoothstep(0.0, 0.5, h));",
      " gl_FragColor = vec4(c, 1.0);",
      "}"
    ].join("\n")
  });
  const skyGeo = new THREE.SphereGeometry(1, 32, 16);
  const sky = new THREE.Mesh(skyGeo, skyMat); sky.scale.setScalar(600); scene.add(sky);
  // stars + moon
  {
    const r = mulberry(7), n = 900, arr = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      const th = r() * TAU, y = 0.2 + r() * 0.8, rr = Math.sqrt(1 - y * y);
      arr[i * 3] = Math.cos(th) * rr * 560; arr[i * 3 + 1] = y * 560; arr[i * 3 + 2] = Math.sin(th) * rr * 560;
    }
    const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(arr, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xdfe4ff, size: 1.6, sizeAttenuation: false, transparent: true, opacity: 0.8, fog: false })));
    const moon = new THREE.Mesh(new THREE.SphereGeometry(12, 24, 16), new THREE.MeshBasicMaterial({ color: 0xf3ecd8, fog: false }));
    moon.position.copy(V(0.55, 0.52, 0.65).normalize().multiplyScalar(520)); scene.add(moon);
  }

  // lights
  scene.add(new THREE.HemisphereLight(0x8a90c8, 0x2a3320, 0.75));
  const sun = new THREE.DirectionalLight(0xffb98f, 1.7);
  sun.position.copy(SUN).multiplyScalar(90); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 220 });
  sun.shadow.bias = -0.0006;
  scene.add(sun);
  const rim = new THREE.DirectionalLight(0x7d8cff, 0.6); rim.position.set(50, 40, 60); scene.add(rim);

  // ---------- ground, trees, village ----------
  function groundH(x, z) {
    const r = Math.hypot(x, z), k = ss(45, 170, r);
    return k * (18 + 12 * Math.sin(x * 0.021 + 1.3) * Math.cos(z * 0.017 - 0.4)) + 0.35 * Math.sin(x * 0.15) * Math.cos(z * 0.13);
  }
  {
    const g = new THREE.PlaneGeometry(900, 900, 150, 150); g.rotateX(-Math.PI / 2);
    const p = g.attributes.position, col = new Float32Array(p.count * 3);
    const a = new THREE.Color(0x2b4520), b = new THREE.Color(0x4f6e2e), c = new THREE.Color();
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), z = p.getZ(i);
      p.setY(i, groundH(x, z));
      const n = 0.5 + 0.5 * Math.sin(x * 0.08 + Math.cos(z * 0.07) * 2.0);
      c.copy(a).lerp(b, n);
      col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
    }
    g.setAttribute("color", new THREE.BufferAttribute(col, 3));
    g.computeVertexNormals();
    const ground = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }));
    ground.receiveShadow = true; scene.add(ground);
  }

  const HOUSES = [[-14, -24, 0.2], [-3, -29, -0.1], [9, -25, 0.15], [19, -19, -0.45], [-23, -15, 0.6], [16, 15, -2.2]];
  {
    const wall = new THREE.MeshStandardMaterial({ color: 0xd8b47c, roughness: 0.9 });
    const beam = new THREE.MeshStandardMaterial({ color: 0x3b2618, roughness: 0.85 });
    const roofM = new THREE.MeshStandardMaterial({ color: 0x4d3222, roughness: 0.95 });
    const stone = new THREE.MeshStandardMaterial({ color: 0x77706a, roughness: 1 });
    const win = new THREE.MeshStandardMaterial({ color: 0xffc070, emissive: 0xffa040, emissiveIntensity: 1.3 });
    for (const [x, z, ry] of HOUSES) {
      const h = new THREE.Group(), w = 6, d = 5, ht = 3.3;
      mk(new THREE.BoxGeometry(w, ht, d), wall, 0, ht / 2, 0, h);
      for (const sx of [-1, 1]) for (const sz of [-1, 1]) mk(new THREE.BoxGeometry(0.24, ht, 0.24), beam, sx * w / 2, ht / 2, sz * d / 2, h);
      for (const sz of [-1, 1]) {
        mk(new THREE.BoxGeometry(w + 0.1, 0.2, 0.08), beam, 0, ht * 0.5, sz * (d / 2 + 0.03), h);
        mk(new THREE.BoxGeometry(w + 0.1, 0.2, 0.08), beam, 0, ht - 0.1, sz * (d / 2 + 0.03), h);
        for (const sx of [-1, 1]) {
          const di = mk(new THREE.BoxGeometry(0.16, 2.0, 0.08), beam, sx * w * 0.33, ht * 0.25, sz * (d / 2 + 0.03), h);
          di.rotation.z = sx * 0.7;
          mk(new THREE.BoxGeometry(0.75, 0.75, 0.06), win, sx * w / 4, ht * 0.75, sz * (d / 2 + 0.04), h);
        }
      }
      mk(new THREE.BoxGeometry(0.95, 1.6, 0.08), beam, 0, 0.8, d / 2 + 0.04, h);
      const sh = new THREE.Shape(); sh.moveTo(-w / 2 - 0.45, 0); sh.lineTo(w / 2 + 0.45, 0); sh.lineTo(0, 2.7); sh.closePath();
      const rg = new THREE.ExtrudeGeometry(sh, { depth: d + 0.8, bevelEnabled: false }); rg.translate(0, 0, -(d + 0.8) / 2);
      mk(rg, roofM, 0, ht, 0, h);
      mk(new THREE.BoxGeometry(0.6, 1.8, 0.6), stone, w * 0.24, ht + 1.5, -d * 0.2, h);
      h.position.set(x, groundH(x, z), z); h.rotation.y = ry; scene.add(h);
    }
  }
  {
    const r = mulberry(21), N = 320;
    const trunk = new THREE.CylinderGeometry(0.25, 0.35, 2, 6); trunk.translate(0, 1, 0);
    const c1 = new THREE.ConeGeometry(2.3, 5, 7); c1.translate(0, 4.4, 0);
    const c2 = new THREE.ConeGeometry(1.6, 3.8, 7); c2.translate(0, 6.9, 0);
    const mT = new THREE.InstancedMesh(trunk, new THREE.MeshStandardMaterial({ color: 0x3a2a1c, roughness: 1 }), N);
    const mA = new THREE.InstancedMesh(c1, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95 }), N);
    const mB = new THREE.InstancedMesh(c2, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95 }), N);
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = V(), p = V(), col = new THREE.Color();
    let k = 0;
    while (k < N) {
      const a = r() * TAU, rr = 30 + Math.pow(r(), 0.7) * 170;
      const x = Math.cos(a) * rr, z = Math.sin(a) * rr;
      if (HOUSES.some((hh) => Math.hypot(x - hh[0], z - hh[1]) < 7.5)) continue;
      const sc = 0.8 + r() * 0.9;
      p.set(x, groundH(x, z) - 0.2, z); q.setFromAxisAngle(UP, r() * TAU); s.set(sc, sc * (0.9 + r() * 0.4), sc);
      m.compose(p, q, s);
      mT.setMatrixAt(k, m); mA.setMatrixAt(k, m); mB.setMatrixAt(k, m);
      col.setHSL(0.27 + r() * 0.08, 0.35 + r() * 0.15, 0.13 + r() * 0.08);
      mA.setColorAt(k, col); mB.setColorAt(k, col.offsetHSL(0, 0, 0.03));
      k++;
    }
    for (const mm of [mT, mA, mB]) { mm.castShadow = true; mm.receiveShadow = true; scene.add(mm); }
  }

  // ---------- particles ----------
  const pVert = "uniform float uScale; attribute vec4 pcolor; attribute float psize; varying vec4 vC; void main(){ vC = pcolor; vec4 mv = modelViewMatrix * vec4(position,1.0); gl_PointSize = psize * uScale / max(0.1, -mv.z); gl_Position = projectionMatrix * mv; }";
  const pFrag = "varying vec4 vC; void main(){ float d = length(gl_PointCoord - 0.5); float a = smoothstep(0.5, 0.0, d); a *= a; if (vC.a * a < 0.003) discard; gl_FragColor = vec4(vC.rgb, vC.a * a); }";
  const uScale = { value: 400 };
  class PSys {
    constructor(max, blending) {
      this.max = max; this.head = 0;
      this.pos = new Float32Array(max * 3); this.col = new Float32Array(max * 4); this.size = new Float32Array(max);
      this.vel = new Float32Array(max * 3); this.age = new Float32Array(max); this.life = new Float32Array(max);
      this.c0 = new Float32Array(max * 4); this.c1 = new Float32Array(max * 4);
      this.s0 = new Float32Array(max); this.s1 = new Float32Array(max); this.drag = new Float32Array(max); this.grav = new Float32Array(max);
      const g = new THREE.BufferGeometry();
      this.aPos = new THREE.BufferAttribute(this.pos, 3); this.aCol = new THREE.BufferAttribute(this.col, 4); this.aSize = new THREE.BufferAttribute(this.size, 1);
      for (const a of [this.aPos, this.aCol, this.aSize]) a.setUsage(THREE.DynamicDrawUsage);
      g.setAttribute("position", this.aPos); g.setAttribute("pcolor", this.aCol); g.setAttribute("psize", this.aSize);
      const mat = new THREE.ShaderMaterial({ uniforms: { uScale }, vertexShader: pVert, fragmentShader: pFrag, transparent: true, depthWrite: false, blending });
      this.points = new THREE.Points(g, mat); this.points.frustumCulled = false; scene.add(this.points);
    }
    spawn(p, v, life, s0, s1, c0, c1, drag, grav) {
      const i = this.head; this.head = (this.head + 1) % this.max;
      this.pos[i * 3] = p.x; this.pos[i * 3 + 1] = p.y; this.pos[i * 3 + 2] = p.z;
      this.vel[i * 3] = v.x; this.vel[i * 3 + 1] = v.y; this.vel[i * 3 + 2] = v.z;
      this.age[i] = 0; this.life[i] = life; this.s0[i] = s0; this.s1[i] = s1;
      for (let k = 0; k < 4; k++) { this.c0[i * 4 + k] = c0[k]; this.c1[i * 4 + k] = c1[k]; }
      this.drag[i] = drag || 0; this.grav[i] = grav || 0;
    }
    update(dt) {
      for (let i = 0; i < this.max; i++) {
        if (this.life[i] <= 0) { this.size[i] = 0; continue; }
        this.age[i] += dt;
        const k = this.age[i] / this.life[i];
        if (k >= 1) { this.life[i] = 0; this.size[i] = 0; this.col[i * 4 + 3] = 0; continue; }
        const dr = Math.exp(-this.drag[i] * dt);
        this.vel[i * 3] *= dr; this.vel[i * 3 + 1] = this.vel[i * 3 + 1] * dr + this.grav[i] * dt; this.vel[i * 3 + 2] *= dr;
        this.pos[i * 3] += this.vel[i * 3] * dt; this.pos[i * 3 + 1] += this.vel[i * 3 + 1] * dt; this.pos[i * 3 + 2] += this.vel[i * 3 + 2] * dt;
        for (let c = 0; c < 4; c++) this.col[i * 4 + c] = this.c0[i * 4 + c] + (this.c1[i * 4 + c] - this.c0[i * 4 + c]) * k;
        this.col[i * 4 + 3] *= Math.min(1, k * 8);
        this.size[i] = this.s0[i] + (this.s1[i] - this.s0[i]) * k;
      }
      this.aPos.needsUpdate = true; this.aCol.needsUpdate = true; this.aSize.needsUpdate = true;
    }
  }
  const smoke = new PSys(2600, THREE.NormalBlending);
  const fire = new PSys(2600, THREE.AdditiveBlending);
  const glow = new PSys(3200, THREE.AdditiveBlending);

  const C = {
    fire0: [1, 0.92, 0.6, 1], fire1: [0.85, 0.14, 0.02, 0],
    shade0: [0.07, 0.03, 0.12, 0.6], shade1: [0.02, 0.01, 0.04, 0],
    violet0: [0.75, 0.55, 1, 1], violet1: [0.22, 0.05, 0.5, 0],
    aura0: [0.65, 0.9, 1, 0.8], aura1: [0.2, 0.4, 0.8, 0],
    spark0: [1, 0.95, 0.8, 1], spark1: [1, 0.4, 0.1, 0],
    ash0: [0.14, 0.1, 0.1, 0.4], ash1: [0.05, 0.04, 0.05, 0]
  };
  const tmpV = V(), tmpV2 = V(), tmpV3 = V();
  function randDir(out) { out.set(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)); if (out.lengthSq() < 1e-4) out.set(0, 1, 0); return out.normalize(); }
  function burst(at, n, speed, sys, c0, c1, s0, s1, life, drag) {
    for (let i = 0; i < n; i++) sys.spawn(at, randDir(tmpV).multiplyScalar(speed * rnd(0.3, 1)), life * rnd(0.6, 1.2), s0, s1, c0, c1, drag, 0);
  }

  // ---------- the paladin ----------
  function makePaladin() {
    const steel = new THREE.MeshStandardMaterial({ color: 0xb4bac2, metalness: 0.55, roughness: 0.32 });
    const steelDS = steel.clone(); steelDS.side = THREE.DoubleSide;
    const steelDark = new THREE.MeshStandardMaterial({ color: 0x5b6068, metalness: 0.5, roughness: 0.4 });

  function crescent(origin, target, tilt, radius, dur, travel) {
    const g = new THREE.Group(); g.position.copy(origin); scene.add(g); g.lookAt(target); g.rotateZ(tilt);
    const arc = Math.PI * 1.1;
    const m1 = new THREE.MeshBasicMaterial({ color: 0xb48cff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
    const m2 = new THREE.MeshBasicMaterial({ color: 0x0e0418, transparent: true, opacity: 0.85, depthWrite: false, side: THREE.DoubleSide });

  // ---------- per-frame update ----------
  const dVel = V(), pVel = V(), prevD = V().copy(D.root.position), prevP = V().copy(P.root.position);
  const prevTip = V(), tipVel = V();
  let simTime = 0, prevCycle = 0, playing = true, slow = false;

        if (Math.random() < 0.25) smoke.spawn(m, tmpV2.multiplyScalar(0.6), rnd(1.2, 1.8), 1.2, 5.5, C.ash0, C.ash1, 0.9, 1.5);

    const base = wp(P.bladeBase), tip = wp(P.bladeTip);
    if (!trInit) { prevTip.copy(tip); trInit = true; }
    tmpV.copy(tip).sub(prevTip).divideScalar(dt); tipVel.lerp(tmpV, 1 - Math.exp(-20 * dt)); prevTip.copy(tip);
    const rel = tmpV.copy(tipVel).sub(pVel).length();
    const swing = ss(5, 16, rel);
    trPos.copyWithin(6, 0, (TR - 1) * 6); trS.copyWithin(1, 0, TR - 1);
    trPos[0] = base.x; trPos[1] = base.y; trPos[2] = base.z; trPos[3] = tip.x; trPos[4] = tip.y; trPos[5] = tip.z; trS[0] = swing;
    for (let i = 0; i < TR; i++) { const a = Math.pow(1 - i / (TR - 1), 1.5) * trS[i]; trA[2 * i] = a * 0.5; trA[2 * i + 1] = a; }
    trPosAttr.needsUpdate = true; trAAttr.needsUpdate = true;

    const G = st.gather;
    const nSmoke = Math.ceil((26 + swing * 90 + G * 60) * dt);
    for (let i = 0; i < nSmoke; i++) {
      tmpV2.copy(base).lerp(tip, Math.random());
      smoke.spawn(tmpV2, V(rnd(-0.4, 0.4), rnd(0.2, 0.9), rnd(-0.4, 0.4)), rnd(0.7, 1.2), 0.22, 0.8, C.shade0, C.shade1, 1.5, 0.3);
      if (Math.random() < 0.45) glow.spawn(tmpV2, V(rnd(-0.3, 0.3), rnd(0.2, 0.8), rnd(-0.3, 0.3)), rnd(0.4, 0.8), 0.14, 0.02, C.violet0, C.violet1, 1, 0);
    }
    if (G > 0) {
      const mid = tmpV3.copy(base).lerp(tip, 0.55);
      const n = Math.ceil(150 * G * dt);
      for (let i = 0; i < n; i++) {
        const p0 = randDir(V()).multiplyScalar(rnd(2.5, 5)).add(mid);
        const v = mid.clone().sub(p0).multiplyScalar(1.7);
        glow.spawn(p0, v, 0.6, 0.12, 0.32, [0.35, 0.2, 0.7, 0.3], [0.85, 0.7, 1, 1], 0, 0);
        if (Math.random() < 0.5) smoke.spawn(p0, v.multiplyScalar(0.9), 0.65, 0.9, 0.3, [0.03, 0.01, 0.06, 0.1], [0.02, 0.01, 0.04, 0.6], 0, 0);
      }
    }
    P.bladeMat.emissiveIntensity = 0.5 + G * 1.8 + swing * 0.6;
    P.haloMat.opacity = 0.14 + G * 0.3 + swing * 0.1;
    P.swordLight.intensity = 1.3 + G * 5 + swing * 1.5;

    // Fly aura motes
    if (air > 0.3) {
      const n = Math.ceil(24 * dt);
      for (let i = 0; i < n; i++) {
        const a = Math.random() * TAU;
        glow.spawn(tmpV2.set(pp.x + Math.cos(a) * 0.6, pp.y + 0.1, pp.z + Math.sin(a) * 0.6), V(0, -rnd(0.8, 1.6), 0).add(tmpV.copy(pVel).multiplyScalar(0.2)), rnd(0.5, 0.9), 0.12, 0.02, C.aura0, C.aura1, 0.5, 0);
      }
    }

    // one-shot effects
    for (let i = fx.length - 1; i >= 0; i--) {
      const e = fx[i]; e.age += dt; const k = Math.min(1, e.age / e.dur);
      e.update(dt, k);
      if (k >= 1) { e.dispose(); fx.splice(i, 1); }
    }
    smoke.update(dt); fire.update(dt); glow.update(dt);
  }

  // ---------- camera ----------
  const cam = { side: 2.75, pitch: 0.1, mix: 0.1, dist: 8.5, yaw: 0, focus: V(6, 2, 10), init: false };
  const user = { yaw: 0, pitch: 0, zoom: 1 };
  function updateCamera(dt) {
    const c = cur ? cur.cam : PHASES[0].cam;
    const pc = pChest(), dc = D.root.position;
    const sep = pc.distanceTo(dc);
    const want = c.fixed || clamp(sep * 1.1 + 9, 13, 42) * c.k;
    const baseYaw = Math.atan2(pc.x - dc.x, pc.z - dc.z);
    if (!cam.init) { cam.side = c.side; cam.pitch = c.pitch; cam.mix = c.mix; cam.dist = want; }
    cam.side = dampAngle(cam.side, c.side, 0.9, dt);
    cam.pitch = damp(cam.pitch, c.pitch, 1.2, dt);
    cam.mix = damp(cam.mix, c.mix, 1.2, dt);
    cam.dist = damp(cam.dist, want, 1.2, dt);
    const yawT = baseYaw + cam.side + user.yaw;
    cam.yaw = cam.init ? dampAngle(cam.yaw, yawT, 1.6, dt) : yawT;
    const f = pc.clone().lerp(dc, cam.mix); f.y += cam.mix < 0.2 ? 0.2 : 0.5;
    if (!cam.init) cam.focus.copy(f); else cam.focus.lerp(f, 1 - Math.exp(-3 * dt));
    cam.init = true;
    const pitch = clamp(cam.pitch + user.pitch, -0.35, 1.3);
    const d = cam.dist * user.zoom;
    camera.position.set(
      cam.focus.x + Math.sin(cam.yaw) * Math.cos(pitch) * d,
      cam.focus.y + Math.sin(pitch) * d,
      cam.focus.z + Math.cos(cam.yaw) * Math.cos(pitch) * d
    );
    camera.position.y = Math.max(camera.position.y, groundH(camera.position.x, camera.position.z) + 1.2);
    shake = damp(shake, 0, 3.5, dt);
    if (shake > 0.01) camera.position.add(randDir(tmpV).multiplyScalar(shake * 0.5));
    camera.lookAt(cam.focus);
  }

  // ---------- HUD ----------
  const tl = $("timeline"), fills = [];
  PHASES.forEach((ph) => {
    const b = document.createElement("button");
    b.type = "button"; b.style.setProperty("--w", String(ph.end - ph.start));
    b.setAttribute("aria-label", "Jump to " + ph.name);
    b.innerHTML = '<span class="fill"></span>' + ph.name;
    b.addEventListener("click", () => { const base = Math.floor(simTime / LOOP) * LOOP; simTime = base + ph.start + 0.001; prevCycle = ph.start; cur = null; });
    tl.appendChild(b); fills.push(b);
  });
  const capEl = $("caption");
  let capTimer = 0;
  function setCaption(ph) {
    capEl.classList.add("fade");
    clearTimeout(capTimer);
    capTimer = setTimeout(() => { $("beatName").textContent = ph.name; $("beatLine").textContent = ph.line; capEl.classList.remove("fade"); }, 220);
    fills.forEach((b, i) => b.classList.toggle("on", PHASES[i] === ph));
  }
  function updateTimeline() {
    const t = ((simTime % LOOP) + LOOP) % LOOP;
    PHASES.forEach((ph, i) => {
      const k = clamp((t - ph.start) / (ph.end - ph.start), 0, 1);
      fills[i].firstChild.style.width = (k * 100).toFixed(1) + "%";
    });
  }
  const playBtn = $("playBtn"), slowBtn = $("slowBtn");
  function togglePlay() { playing = !playing; playBtn.textContent = playing ? "Pause" : "Play"; }
  playBtn.addEventListener("click", togglePlay);
  slowBtn.addEventListener("click", () => { slow = !slow; slowBtn.setAttribute("aria-pressed", String(slow)); });
  $("camBtn").addEventListener("click", () => { user.yaw = 0; user.pitch = 0; user.zoom = 1; });
  window.addEventListener("keydown", (e) => { if (e.code === "Space" && e.target === document.body) { e.preventDefault(); togglePlay(); } });

  // orbit / zoom
  const cv = renderer.domElement;
  const ptrs = new Map(); let pinch0 = 0, zoom0 = 1;
  cv.addEventListener("pointerdown", (e) => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); zoom0 = user.zoom; } });
  cv.addEventListener("pointermove", (e) => {
    const p = ptrs.get(e.pointerId); if (!p) return;
    if (ptrs.size === 1) { user.yaw -= (e.clientX - p.x) * 0.006; user.pitch = clamp(user.pitch + (e.clientY - p.y) * 0.004, -0.6, 1.0); }
    p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size === 2 && pinch0 > 0) { const [a, b] = [...ptrs.values()]; user.zoom = clamp(zoom0 * pinch0 / Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)), 0.45, 2.2); }
  });
  const up2 = (e) => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = 0; };
  cv.addEventListener("pointerup", up2); cv.addEventListener("pointercancel", up2);
  cv.addEventListener("wheel", (e) => { e.preventDefault(); user.zoom = clamp(user.zoom * Math.exp(e.deltaY * 0.001), 0.45, 2.2); }, { passive: false });
  cv.addEventListener("dblclick", () => { user.yaw = 0; user.pitch = 0; user.zoom = 1; });

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w / h < 0.8 ? 64 : 50;
    camera.updateProjectionMatrix();
    uScale.value = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  }
  window.addEventListener("resize", resize); resize();

  // ---------- loop ----------
  let last = performance.now(), wallT = 0;
  enter(PHASES[0]);
  function frame(now) {
    const real = clamp((now - last) / 1000, 0, 0.05); last = now;
    wallT += playing ? real * (slow ? 0.35 : 1) : 0;
    const dt = playing ? real * (slow ? 0.35 : 1) * st.dilate : 0;
    simTime += dt;
    step(dt, wallT);
    updateCamera(real);
    updateTimeline();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
