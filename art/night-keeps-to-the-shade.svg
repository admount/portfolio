<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Night Keeps to the Shade</title>
  <desc>An original painting in homage to Magritte, Hopper and O'Keeffe: a lone desert lunch counter under a bright afternoon sky, whose shadows hold the night.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6d9e"/>
      <stop offset="0.55" stop-color="#7fb3cf"/>
      <stop offset="1" stop-color="#e9dcc0"/>
    </linearGradient>
    <radialGradient id="cloud" cx="0.45" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f4f1ea"/>
      <stop offset="1" stop-color="#b9c6d2"/>
    </radialGradient>
    <linearGradient id="cliffs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe0c4"/>
      <stop offset="0.16" stop-color="#e8cfa8"/>
      <stop offset="0.17" stop-color="#d98a5f"/>
      <stop offset="0.38" stop-color="#c2593b"/>
      <stop offset="0.39" stop-color="#e2a86f"/>
      <stop offset="0.55" stop-color="#d7955f"/>
      <stop offset="0.56" stop-color="#b3473a"/>
      <stop offset="0.78" stop-color="#9c3b35"/>
      <stop offset="0.79" stop-color="#c98a7a"/>
      <stop offset="1" stop-color="#b87a6d"/>
    </linearGradient>
    <linearGradient id="hillsFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a58e"/>
      <stop offset="1" stop-color="#b98673"/>
    </linearGradient>
    <linearGradient id="hillsGrey" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7b2a8"/>
      <stop offset="1" stop-color="#9a8487"/>
    </linearGradient>
    <linearGradient id="mesa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e8fb5"/>
      <stop offset="1" stop-color="#b3a8c0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9b77f"/>
      <stop offset="0.5" stop-color="#cf9f63"/>
      <stop offset="1" stop-color="#b9834b"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1633"/>
      <stop offset="0.6" stop-color="#16244d"/>
      <stop offset="1" stop-color="#27386a"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6e7c4"/>
      <stop offset="1" stop-color="#ecd3a2"/>
    </linearGradient>
    <linearGradient id="interior" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3eeb0"/>
      <stop offset="1" stop-color="#cfd79a"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f8a86"/>
      <stop offset="1" stop-color="#6f6a68"/>
    </linearGradient>
    <radialGradient id="bone" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="0.7" stop-color="#efe6d2"/>
      <stop offset="1" stop-color="#cdbfa3"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>

    <!-- A reusable scatter of stars -->
    <g id="stars">
      <circle cx="12" cy="10" r="1.6"/><circle cx="48" cy="26" r="1"/><circle cx="90" cy="8" r="1.3"/>
      <circle cx="130" cy="34" r="2"/><circle cx="170" cy="14" r="1"/><circle cx="210" cy="40" r="1.4"/>
      <circle cx="250" cy="20" r="1"/><circle cx="292" cy="46" r="1.8"/><circle cx="330" cy="12" r="1.2"/>
      <circle cx="372" cy="36" r="1"/><circle cx="30" cy="54" r="1.2"/><circle cx="70" cy="62" r="1.8"/>
      <circle cx="112" cy="70" r="1"/><circle cx="156" cy="58" r="1.3"/><circle cx="196" cy="76" r="1"/>
      <circle cx="238" cy="64" r="2.1"/><circle cx="278" cy="82" r="1"/><circle cx="318" cy="70" r="1.4"/>
      <circle cx="360" cy="88" r="1.1"/><circle cx="20" cy="92" r="1"/><circle cx="60" cy="100" r="1.4"/>
    </g>
    <clipPath id="bldgShadowClip">
      <path d="M1180,722 L1242,700 L1600,708 L1600,790 Z"/>
    </clipPath>
    <clipPath id="poleShadowClip">
      <path d="M372,792 L388,792 L724,768 L712,766 Z"/>
    </clipPath>
    <clipPath id="skullShadowClip">
      <path d="M214,928 C200,916 250,894 300,890 C380,884 460,885 520,890 C440,920 300,936 214,928 Z"/>
    </clipPath>
    <clipPath id="windowClip">
      <rect x="800" y="572" width="262" height="112"/>
    </clipPath>
  </defs>

  <g filter="url(#grain)">
    <!-- Sky -->
    <rect width="1600" height="620" fill="url(#sky)"/>

    <!-- Magritte clouds -->
    <g fill="url(#cloud)">
      <g transform="translate(260,150)">
        <ellipse cx="0" cy="20" rx="90" ry="40"/><circle cx="-40" cy="0" r="45"/>
        <circle cx="20" cy="-20" r="58"/><circle cx="75" cy="10" r="42"/><ellipse cx="10" cy="40" rx="120" ry="26"/>
      </g>
      <g transform="translate(780,95) scale(0.8)">
        <ellipse cx="0" cy="20" rx="100" ry="40"/><circle cx="-55" cy="5" r="40"/>
        <circle cx="0" cy="-22" r="55"/><circle cx="60" cy="-4" r="46"/><ellipse cx="0" cy="40" rx="130" ry="24"/>
      </g>
      <g transform="translate(1320,200) scale(1.1)">
        <ellipse cx="0" cy="20" rx="95" ry="36"/><circle cx="-50" cy="4" r="38"/>
        <circle cx="4" cy="-24" r="54"/><circle cx="62" cy="6" r="40"/><ellipse cx="0" cy="38" rx="125" ry="22"/>
      </g>
      <g transform="translate(1040,320) scale(0.55)">
        <ellipse cx="0" cy="20" rx="95" ry="36"/><circle cx="-45" cy="0" r="40"/>
        <circle cx="10" cy="-20" r="50"/><circle cx="60" cy="8" r="36"/><ellipse cx="0" cy="36" rx="120" ry="20"/>
      </g>
      <g transform="translate(520,300) scale(0.45)">
        <ellipse cx="0" cy="20" rx="95" ry="36"/><circle cx="-45" cy="0" r="40"/>
        <circle cx="10" cy="-20" r="50"/><circle cx="60" cy="8" r="36"/><ellipse cx="0" cy="36" rx="120" ry="20"/>
      </g>
    </g>

    <!-- O'Keeffe distance: the flat-topped mesa -->
    <path d="M0,500 L90,470 L150,432 L185,392 L310,388 L350,425 L440,470 L560,500 L560,560 L0,560 Z" fill="url(#mesa)"/>

    <!-- Banded cliffs -->
    <path d="M420,560 C470,500 520,470 600,452 C660,440 700,420 760,418 C830,416 860,440 930,444
             C1010,450 1060,420 1140,414 C1220,408 1270,440 1330,452 C1400,466 1470,450 1540,462
             L1600,470 L1600,600 L420,600 Z" fill="url(#cliffs)"/>
    <!-- erosion strokes on the cliffs -->
    <g stroke="#8a3530" stroke-width="3" stroke-linecap="round" opacity="0.35" fill="none">
      <path d="M640,470 q6,40 -4,90"/><path d="M700,450 q-4,50 6,110"/><path d="M790,430 q8,60 -2,130"/>
      <path d="M880,448 q-6,50 4,112"/><path d="M1000,452 q6,50 -4,108"/><path d="M1120,424 q-8,60 4,136"/>
      <path d="M1230,440 q6,50 -2,120"/><path d="M1350,460 q-4,50 4,100"/><path d="M1460,462 q6,40 -2,98"/>
    </g>

    <!-- Soft rounded grey-rose hills -->
    <path d="M0,560 C80,520 160,515 240,535 C320,555 360,520 450,518 C540,516 600,560 660,575 L660,600 L0,600 Z" fill="url(#hillsGrey)"/>
    <path d="M1000,580 C1080,540 1160,530 1260,548 C1360,566 1420,530 1500,528 C1550,527 1580,540 1600,548 L1600,600 L1000,600 Z" fill="url(#hillsFront)"/>

    <!-- Desert floor -->
    <rect y="590" width="1600" height="410" fill="url(#ground)"/>
    <!-- sage brush dabs -->
    <g fill="#8c9468" opacity="0.8">
      <ellipse cx="120" cy="640" rx="22" ry="7"/><ellipse cx="300" cy="660" rx="16" ry="5"/>
      <ellipse cx="560" cy="632" rx="18" ry="6"/><ellipse cx="660" cy="680" rx="26" ry="8"/>
      <ellipse cx="1320" cy="640" rx="20" ry="6"/><ellipse cx="1480" cy="660" rx="24" ry="7"/>
      <ellipse cx="80" cy="760" rx="30" ry="9"/><ellipse cx="520" cy="880" rx="40" ry="11"/>
      <ellipse cx="1420" cy="880" rx="44" ry="12"/><ellipse cx="1000" cy="930" rx="36" ry="10"/>
    </g>

    <!-- Road -->
    <path d="M0,736 L1600,742 L1600,790 L0,786 Z" fill="url(#road)"/>
    <path d="M0,761 L1600,766" stroke="#e8d9a8" stroke-width="3" stroke-dasharray="40 34"/>

    <!-- === The Magritte turn: every shadow holds the night === -->
    <!-- building shadow -->
    <g clip-path="url(#bldgShadowClip)">
      <rect x="1170" y="690" width="440" height="110" fill="url(#night)"/>
      <g fill="#fdf7dc">
        <use href="#stars" transform="translate(1250,702) scale(1,0.8)"/>
        <use href="#stars" transform="translate(1210,730) scale(1.1,0.6)"/>
      </g>
      <!-- a crescent moon in the shade -->
      <circle cx="1480" cy="735" r="16" fill="#fff4c8"/>
      <circle cx="1488" cy="730" r="14" fill="#152349"/>
    </g>
    <!-- telephone pole shadow -->
    <g clip-path="url(#poleShadowClip)">
      <rect x="360" y="760" width="400" height="40" fill="url(#night)"/>
      <g fill="#fdf7dc"><use href="#stars" transform="translate(390,770) scale(0.9,0.2)"/></g>
    </g>
    <!-- skull shadow -->
    <g clip-path="url(#skullShadowClip)">
      <rect x="190" y="880" width="340" height="60" fill="url(#night)"/>
      <g fill="#fdf7dc"><use href="#stars" transform="translate(230,892) scale(0.75,0.35)"/></g>
    </g>

    <!-- === Hopper's lunch counter === -->
    <!-- shaded side wall -->
    <path d="M1180,470 L1242,478 L1242,700 L1180,722 Z" fill="#9f8a74"/>
    <!-- front facade -->
    <rect x="760" y="470" width="420" height="252" fill="url(#facade)"/>
    <!-- sign band and cornice -->
    <rect x="752" y="462" width="436" height="12" fill="#e9d6ae"/>
    <path d="M1188,462 L1250,470 L1250,480 L1188,474 Z" fill="#8a7662"/>
    <rect x="760" y="474" width="420" height="62" fill="#2e5a4c"/>
    <text x="970" y="522" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
          font-size="40" letter-spacing="14" fill="#f4e6c1">LUNCH</text>
    <!-- shadow under sign band -->
    <rect x="760" y="536" width="420" height="14" fill="#c9ad7e" opacity="0.8"/>

    <!-- window: electric light in the afternoon -->
    <rect x="794" y="566" width="274" height="124" fill="#5b4a3a"/>
    <g clip-path="url(#windowClip)">
      <rect x="800" y="572" width="262" height="112" fill="url(#interior)"/>
      <!-- back wall and shelf -->
      <rect x="800" y="572" width="262" height="44" fill="#c9cf8e"/>
      <rect x="800" y="612" width="262" height="4" fill="#8a7b55"/>
      <!-- coffee urns -->
      <rect x="1000" y="588" width="18" height="26" rx="3" fill="#b8b6ae"/>
      <rect x="1024" y="592" width="16" height="22" rx="3" fill="#a9a79e"/>
      <!-- counter -->
      <rect x="800" y="650" width="262" height="34" fill="#7b4a2e"/>
      <rect x="800" y="646" width="262" height="6" fill="#d8c79a"/>
      <!-- the woman in red, alone -->
      <g>
        <path d="M896,648 C892,626 898,612 912,608 C926,612 932,626 928,648 Z" fill="#b22f2a"/>
        <circle cx="912" cy="596" r="11" fill="#e9c3a2"/>
        <path d="M900,594 C900,580 924,578 925,594 C920,586 906,586 900,594 Z" fill="#6e3a22"/>
        <path d="M926,628 L948,642" stroke="#e9c3a2" stroke-width="5" stroke-linecap="round"/>
        <rect x="944" y="638" width="10" height="9" rx="2" fill="#f2f1ea"/>
        <!-- stool -->
        <rect x="906" y="648" width="12" height="36" fill="#3d3a38"/>
      </g>
      <!-- an O'Keeffe jimsonweed in a glass on the counter -->
      <path d="M842,646 L846,626" stroke="#4f6b3a" stroke-width="2"/>
      <path d="M846,628 C832,612 836,598 846,602 C856,598 862,612 846,628 Z" fill="#fbf8ee"/>
      <rect x="838" y="634" width="14" height="13" fill="#dfe8e0" opacity="0.8"/>
      <!-- glare -->
      <path d="M800,572 L850,572 L800,640 Z" fill="#ffffff" opacity="0.12"/>
    </g>
    <!-- mullion -->
    <rect x="930" y="566" width="6" height="124" fill="#5b4a3a"/>

    <!-- door -->
    <rect x="1096" y="590" width="58" height="132" fill="#2e5a4c"/>
    <rect x="1104" y="600" width="42" height="56" fill="#e7e6a6" opacity="0.9"/>
    <circle cx="1146" cy="672" r="3" fill="#d4b56a"/>
    <!-- step -->
    <rect x="1088" y="720" width="74" height="8" fill="#cbb690"/>

    <!-- low raking light across facade base -->
    <rect x="760" y="700" width="420" height="22" fill="#b39c78" opacity="0.35"/>

    <!-- === Telephone pole and wire === -->
    <rect x="374" y="400" width="10" height="392" fill="#5c4632"/>
    <rect x="344" y="420" width="70" height="7" fill="#5c4632"/>
    <circle cx="350" cy="416" r="4" fill="#dfe6e8"/><circle cx="408" cy="416" r="4" fill="#dfe6e8"/>
    <path d="M408,418 C600,470 700,480 1180,486" stroke="#3c3028" stroke-width="1.6" fill="none"/>
    <path d="M350,418 C200,450 100,460 0,462" stroke="#3c3028" stroke-width="1.6" fill="none"/>

    <!-- === O'Keeffe's bleached skull in the foreground === -->
    <g transform="translate(160,794)">
      <!-- horns -->
      <path d="M40,30 C0,20 -40,-10 -30,-60 C-22,-30 10,-8 52,4 Z" fill="#e8dcc0"/>
      <path d="M110,30 C150,20 190,-10 180,-60 C172,-30 140,-8 98,4 Z" fill="#e8dcc0"/>
      <!-- cranium and muzzle -->
      <path d="M40,6 C60,-8 90,-8 110,6 C118,30 108,54 98,80 C92,100 88,120 82,130
               C78,136 72,136 68,130 C62,120 58,100 52,80 C42,54 32,30 40,6 Z" fill="url(#bone)"/>
      <!-- eye sockets -->
      <ellipse cx="58" cy="40" rx="9" ry="7" fill="#3a2f2a" transform="rotate(20 58 40)"/>
      <ellipse cx="92" cy="40" rx="9" ry="7" fill="#3a2f2a" transform="rotate(-20 92 40)"/>
      <!-- nasal -->
      <path d="M70,110 C72,120 78,120 80,110 C78,116 72,116 70,110 Z" fill="#6b5a4d"/>
      <path d="M75,60 L75,100" stroke="#c9b894" stroke-width="2"/>
    </g>
  </g>

  <!-- vignette -->
  <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
    <stop offset="0.65" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#2a1a10" stop-opacity="0.35"/>
  </radialGradient>
  <rect width="1600" height="1000" fill="url(#vig)"/>
</svg>
