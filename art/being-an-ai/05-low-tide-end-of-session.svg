<title>Low Tide, End of Session</title>
<desc>A message written in the sand at dusk. The dry letters are still clear; the tide is already softening the rest.</desc>
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
  <filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="blur14"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="blur40"><feGaussianBlur stdDeviation="40"/></filter>
  <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
    <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#05060b" stop-opacity="0.45"/>
  </radialGradient>

  <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
